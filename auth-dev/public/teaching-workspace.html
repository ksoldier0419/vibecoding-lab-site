<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교안과 메모</title><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/auth-assets/instructor.css"><link rel="stylesheet" href="/auth-assets/teaching-workspace.css"><script src="/auth-assets/teaching-workspace.js" defer></script></head><body>
<header class="workspace-header"><a href="/courses.html">내 강의자료</a> · <a href="/login.html" target="_blank" rel="noopener">로그인 새 창</a><h1 id="workspace-title">교안과 메모</h1><div class="workspace-selectors"><label>과목 <select id="workspace-course" disabled></select></label><label>교안 <select id="workspace-lesson" disabled></select></label></div><p id="workspace-status" role="status">불러오는 중…</p><button id="workspace-retry" type="button">다시 불러오기</button></header>
<main class="workspace-layout"><iframe id="workspace-frame" title="선택한 교안" hidden></iframe>
<aside><section id="student-editor" hidden><h2>내 학습 메모</h2><p class="note-disclosure">이 메모는 관리자와 해당 과목·분반을 담당하는 조교가 열람할 수 있습니다.</p>
<label for="lesson-note">수업 중 정리한 내용이나 질문을 적으세요.</label><textarea id="lesson-note" rows="16" maxlength="20000" disabled></textarea><p id="note-status" role="status"></p><button id="save-note" type="button" disabled>지금 저장</button><button id="reload-note" type="button">다시 불러오기</button><p><a href="/login.html" target="_blank" rel="noopener">로그인 새 창</a></p><p>입력 후 1초 뒤 자동 저장합니다. 내용을 모두 지우고 저장하면 빈 메모가 됩니다.</p></section>
<section id="student-review" hidden><h2>학생 학습 메모</h2><p id="review-status" role="status"></p><label for="review-student">메모를 작성한 학생</label><select id="review-student" disabled></select><button id="review-refresh" type="button">목록 새로고침</button><button id="review-more" type="button" hidden>더 불러오기</button><pre id="review-text"></pre><p id="review-updated"></p><p>학생 메모는 읽기 전용입니다. 내 수업 메모는 교안 안의 수업 메모 영역에서 작성합니다.</p></section></aside></main></body></html>
