<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체 학생 관리 | Vibe Coding Lab</title><link rel="stylesheet" href="/auth-assets/login.css"><link rel="stylesheet" href="/auth-assets/admin.css"><script src="/auth-assets/students.js?v=1" defer></script></head>
<body><main><header><h1>전체 학생 관리</h1><a href="/admin.html">수강 명단 관리로 돌아가기</a></header><p id="status" role="status" aria-live="polite">교수 권한을 확인하고 있습니다.</p><div id="admin-content" hidden><section><h2>전체 학생 관리</h2>
<p class="muted">과목이 없는 학생도 등록하고 수정할 수 있습니다. 학번·이름 변경은 모든 수강 명단과 가입 정보에 반영됩니다. 수강 삭제는 학생 기본 정보를 삭제하지 않습니다.</p>
<div class="panels"><form id="person-editor"><h3 id="person-title">학생 기본 정보 등록</h3>
<label for="person-number">학번</label><input id="person-number" name="studentNumber" required pattern="[A-Za-z0-9\-]{4,20}" maxlength="20">
<label for="person-name">이름</label><input id="person-name" name="name" required maxlength="100">
<div class="form-actions"><button type="submit">기본 정보 저장</button><button type="button" id="person-cancel" hidden>수정 취소</button></div>
<p id="person-status" role="status" aria-live="polite"></p></form>
<div><label for="person-search">전체 학생 학번·이름 검색</label><input id="person-search" type="search">
<label><input id="person-unenrolled" type="checkbox" style="width:auto"> 수강 과목 없는 학생만</label>
<button id="person-refresh" type="button">목록 새로고침</button></div></div>
<div class="table-scroll"><table><thead><tr><th>학번</th><th>이름</th><th>수강 과목·분반</th><th>가입 상태</th><th>관리</th></tr></thead><tbody id="person-rows"></tbody></table></div>
<p id="person-count"></p></section>
</div></main></body></html>
