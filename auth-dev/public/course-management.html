<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>과목 관리 | Vibe Coding Lab</title><link rel="stylesheet" href="/auth-assets/login.css"><link rel="stylesheet" href="/auth-assets/admin.css"><script src="/auth-assets/course-management.js?v=1" defer></script></head><body><main><header><h1>과목 관리</h1><a href="/admin.html">수강 명단 관리로 돌아가기</a></header><p id="status" role="status" aria-live="polite">교수 권한을 확인하고 있습니다.</p><div id="admin-content" hidden><section><h2>과목 관리</h2>
<p class="muted">과목코드는 등록 후 유지하고 과목명만 수정합니다. 이름을 변경해도 기존 수강 명단과 CSV의 과목코드는 그대로 사용할 수 있습니다. 수강생이 없는 과목만 삭제할 수 있습니다.</p>
<div class="panels course-panels"><form id="course-editor">
<h3 id="course-editor-title">새 과목 등록</h3>
<label for="course-code">과목코드</label><input id="course-code" name="id" required maxlength="80" pattern="[a-z0-9_\-]{1,80}" placeholder="예: 2026-2-python_adv">
<p class="muted">영문 소문자·숫자·밑줄·하이픈, 최대 80자</p>
<label for="course-title">과목명</label><input id="course-title" name="title" required maxlength="150">
<div class="form-actions"><button type="submit">과목 저장</button><button id="course-cancel" type="button" hidden>수정 취소</button></div>
</form><div class="table-scroll course-table"><table><thead><tr><th>과목코드</th><th>과목명</th><th>관리</th></tr></thead><tbody id="course-list"></tbody></table></div></div>
</section>
</div></main></body></html>
